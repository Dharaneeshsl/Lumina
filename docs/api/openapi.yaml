openapi: 3.1.0
info:
  title: Lumina API
  version: 1.0.0
  description: Existing internal endpoints are mounted below /api. New public endpoints use /api/v1.
servers:
  - url: http://localhost:3000
security:
  - sessionCookie: []
paths:
  /api/profile/me:
    get:
      summary: Get the current user's profile
      responses:
        '200': { description: Profile returned }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      summary: Update or create the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Updated profile returned }
  /api/friends:
    get:
      summary: List accepted friends
      responses:
        '200': { description: Friends returned }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/posts:
    post:
      summary: Create a post with optional media
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                content: { type: string }
                visibility: { type: string, enum: [PUBLIC, COLLEGE, FRIENDS, PRIVATE] }
                media: { type: array, items: { type: string, format: binary } }
      responses:
        '201': { description: Post created }
  /api/leaderboard:
    get:
      summary: Get a paginated LeetCode leaderboard
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: query
          in: query
          schema: { type: string }
      responses:
        '200': { description: Leaderboard returned }
  /api/v1/video/token:
    post:
      summary: Generate a Stream Video authentication user token
      responses:
        '200': { description: Token and Stream API Key returned }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Rate limit exceeded }
  /api/v1/video/calls:
    post:
      summary: Initialize a new 1-on-1 or group video call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  {
                    type: string,
                    enum: [ONE_ON_ONE, GROUP, MENTORSHIP, CLUB_MEETING, FACULTY_SESSION],
                  }
                title: { type: string }
                participantIds: { type: array, items: { type: string } }
      responses:
        '201': { description: Video call created }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/video/calls/history:
    get:
      summary: List past video calls for the authenticated user
      responses:
        '200': { description: Call history array returned }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
  responses:
    Unauthorized:
      description: Authentication required

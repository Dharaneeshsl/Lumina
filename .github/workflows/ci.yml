name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: 'postgresql://lumina_user:lumina_password@localhost:5432/lumina_dev'
      BETTER_AUTH_SECRET: 'lumina-super-secret-key-123456789'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile || bun install
      - run: bun run --filter @lumina/db generate
      - run: bun run format:check
      - run: bun run lint
      - run: bun run check-types
      - run: bun run check-openapi

  build-apps:
    name: Build API & Web production apps
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: 'postgresql://lumina_user:lumina_password@localhost:5432/lumina_dev'
      BETTER_AUTH_SECRET: 'lumina-super-secret-key-123456789'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile || bun install
      - run: bun run --filter @lumina/db generate
      - run: bun run --filter api build
      - run: bun run --filter web build

  container-security:
    name: Production image vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API production image
        run: docker build --pull -f apps/api/Dockerfile -t lumina-api:${{ github.sha }} .
      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: lumina-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

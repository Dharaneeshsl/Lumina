name: Bruno API Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bruno-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumina_user
          POSTGRES_PASSWORD: lumina_password
          POSTGRES_DB: lumina_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: 'postgresql://lumina_user:lumina_password@localhost:5432/lumina_dev'
      REDIS_URL: 'redis://localhost:6379'
      BETTER_AUTH_SECRET: 'lumina-super-secret-key-123456789'
      SERVER_PORT: '3002'
      NODE_ENV: 'test'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - run: bun install --frozen-lockfile || bun install

      - name: Generate Prisma Client & Push DB Schema
        run: |
          bun run --filter @lumina/db generate
          bun run --filter @lumina/db push

      - name: Start API Server & Wait for Ready
        run: |
          (cd apps/api && bun server.ts) &
          for i in {1..30}; do
            if curl -s http://127.0.0.1:3002/ready | grep -q '"status":"ready"'; then
              echo "API Server is healthy and ready!"
              break
            fi
            echo "Waiting for API server to become ready..."
            sleep 1
          done

      - run: mkdir -p reports

      - uses: usebruno/bruno-cli-action@v1
        with:
          working-directory: bruno
          command: >
            run
            --env ci
            --workspace-path ..
            --tags smoke,workflow,release-gate
            --env-var platform_name="GitHub Actions"
            --env-var build_id="${{ github.run_id }}"
            --env-var commit_sha="${{ github.sha }}"
            --reporter-html ../reports/github-actions-report.html

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bruno-report
          path: reports/github-actions-report.html
          if-no-files-found: ignore

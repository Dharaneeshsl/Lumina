version: '1.0'

linter: jetbrains/qodana-js:2026.1

profile:
  name: qodana.recommended

include:
  - name: CheckDependencyLicenses
  - name: JSUnusedLocalSymbols
  - name: ESLint
  - name: TypeScript

exclude:
  - name: All
    paths:
      - '**/node_modules/**'
      - '**/.turbo/**'
      - '**/dist/**'
      - '**/build/**'
      - '**/.next/**'
      - '**/coverage/**'
      - '**/.git/**'

bootstrap: |
  bun install --frozen-lockfile || bun install
